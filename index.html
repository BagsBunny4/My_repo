<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ALELU — Magnus Finance WebApp</title>

  <!-- Telegram WebApp SDK (optional in browser) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      --bg:#0b0f14;
      --card:#101826;
      --card2:#0f1722;
      --stroke:#1f2a3a;
      --text:#e7edf5;
      --muted:#9fb0c3;
      --accent:#4f8cff;
      --accent2:#62d3a7;
      --warn:#ffcc66;
      --danger:#ff6b6b;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius:16px;
      --radius2:22px;
      --pad:16px;
      --pad2:22px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:var(--sans);
      background: radial-gradient(1200px 600px at 10% -10%, rgba(79,140,255,.25), transparent 55%),
                  radial-gradient(1000px 500px at 100% 0%, rgba(98,211,167,.18), transparent 50%),
                  radial-gradient(900px 600px at 20% 110%, rgba(255,204,102,.12), transparent 50%),
                  var(--bg);
      color:var(--text);
    }
    a{color:inherit}
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:22px 16px 80px;
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      border:1px solid var(--stroke);
      border-radius:var(--radius2);
      background: linear-gradient(180deg, rgba(16,24,38,.92), rgba(16,24,38,.72));
      box-shadow: var(--shadow);
      position:sticky;
      top:10px;
      z-index:10;
      backdrop-filter: blur(10px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:220px;
    }
    .logo{
      width:36px;height:36px;border-radius:12px;
      background: linear-gradient(135deg, rgba(79,140,255,.95), rgba(98,211,167,.85));
      display:grid;place-items:center;
      font-weight:700;
      color:#07101a;
      box-shadow: 0 10px 25px rgba(79,140,255,.25);
    }
    .brand h1{
      font-size:14px;
      margin:0;
      line-height:1.2;
      font-weight:650;
      letter-spacing:.2px;
    }
    .brand .sub{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
      font-weight:500;
    }
    .meta{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }
    .pill{
      border:1px solid var(--stroke);
      background: rgba(15,23,34,.65);
      padding:8px 10px;
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      display:flex;align-items:center;gap:8px;
    }
    .dot{
      width:8px;height:8px;border-radius:999px;background:var(--accent2);
      box-shadow: 0 0 0 4px rgba(98,211,167,.12);
    }
    .btn{
      border:1px solid var(--stroke);
      background: rgba(15,23,34,.65);
      color:var(--text);
      padding:8px 12px;
      border-radius:12px;
      font-size:12px;
      cursor:pointer;
      transition:.15s ease;
      display:inline-flex;gap:8px;align-items:center;
    }
    .btn:hover{transform: translateY(-1px); border-color:#2a3b52;}
    .btn.primary{
      background: linear-gradient(135deg, rgba(79,140,255,.9), rgba(79,140,255,.7));
      border-color: rgba(79,140,255,.55);
    }
    .btn.green{
      background: linear-gradient(135deg, rgba(98,211,167,.88), rgba(98,211,167,.62));
      border-color: rgba(98,211,167,.55);
      color:#08141f;
      font-weight:650;
    }
    .tabs{
      margin-top:16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .tab{
      user-select:none;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background: rgba(15,23,34,.55);
      color:var(--muted);
      font-size:13px;
      cursor:pointer;
      transition:.15s ease;
      display:flex; gap:8px; align-items:center;
    }
    .tab.active{
      background: linear-gradient(180deg, rgba(16,24,38,.9), rgba(15,23,34,.55));
      color:var(--text);
      border-color:#2b3c54;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .grid{
      margin-top:16px;
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:14px;
    }
    @media (max-width: 920px){
      .grid{grid-template-columns:1fr;}
      .brand{min-width:unset;}
    }
    .card{
      border:1px solid var(--stroke);
      border-radius:var(--radius2);
      background: linear-gradient(180deg, rgba(16,24,38,.9), rgba(16,24,38,.68));
      box-shadow: var(--shadow);
      padding:var(--pad2);
    }
    .card h2{
      margin:0 0 10px;
      font-size:14px;
      letter-spacing:.2px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .card h2 span.small{font-size:12px;color:var(--muted);font-weight:500}
    .muted{color:var(--muted)}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin:10px 0;
      flex:1;
      min-width:190px;
    }
    .label{font-size:12px;color:var(--muted)}
    input, select, textarea{
      width:100%;
      padding:11px 12px;
      border-radius:14px;
      border:1px solid #223145;
      background: rgba(9,14,21,.55);
      color:var(--text);
      outline:none;
      transition:.15s ease;
      font-size:13px;
    }
    textarea{min-height:86px; resize:vertical}
    input:focus, select:focus, textarea:focus{
      border-color: rgba(79,140,255,.7);
      box-shadow: 0 0 0 4px rgba(79,140,255,.10);
    }
    .help{
      font-size:12px;
      color:var(--muted);
      line-height:1.45;
      margin-top:10px;
    }
    .table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      overflow:hidden;
      border-radius:16px;
      border:1px solid #223145;
      background: rgba(9,14,21,.25);
    }
    .table th, .table td{
      padding:12px 10px;
      font-size:12.5px;
      border-bottom:1px solid #1b2736;
      vertical-align:top;
    }
    .table th{
      text-align:left;
      color:var(--muted);
      font-weight:600;
      background: rgba(16,24,38,.55);
    }
    .table tr:last-child td{border-bottom:none}
    .chip{
      display:inline-flex;
      gap:6px;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid #2a3b52;
      background: rgba(15,23,34,.55);
      font-size:12px;
      color:var(--text);
      white-space:nowrap;
    }
    .chip.ok{border-color: rgba(98,211,167,.5); background: rgba(98,211,167,.08);}
    .chip.warn{border-color: rgba(255,204,102,.5); background: rgba(255,204,102,.10);}
    .chip.bad{border-color: rgba(255,107,107,.55); background: rgba(255,107,107,.10);}
    .kpi{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:10px;
    }
    .kpi .box{
      border:1px solid #223145;
      border-radius:18px;
      padding:14px 14px;
      background: rgba(9,14,21,.35);
    }
    .kpi .val{font-size:20px;font-weight:700;letter-spacing:.2px}
    .kpi .name{font-size:12px;color:var(--muted);margin-top:4px}
    .sep{height:1px;background:#1b2736;margin:14px 0}
    .footer{
      margin-top:16px;
      font-size:12px;
      color:var(--muted);
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
      opacity:.95;
    }
    .badge{
      font-family:var(--mono);
      font-size:11px;
      padding:6px 10px;
      border-radius:12px;
      border:1px solid #223145;
      background: rgba(9,14,21,.35);
      color:var(--muted);
    }
    .modal-backdrop{
      position:fixed; inset:0; background: rgba(0,0,0,.55);
      display:none; align-items:center; justify-content:center;
      padding:20px; z-index:100;
    }
    .modal{
      max-width:720px; width:100%;
      border-radius:22px;
      border:1px solid #223145;
      background: linear-gradient(180deg, rgba(16,24,38,.96), rgba(16,24,38,.80));
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      padding:18px 18px 16px;
    }
    .modal h3{margin:0 0 8px; font-size:14px}
    .modal p{margin:0; font-size:12.5px; color:var(--muted); line-height:1.45}
    .modal .actions{margin-top:12px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;}
    .hint{
      font-size:11.5px;
      color:var(--muted);
      margin-top:8px;
      line-height:1.35;
    }
    .inline-link{cursor:pointer; color: rgba(79,140,255,.95); text-decoration: underline; text-underline-offset: 3px;}
    .toggle{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin-top:10px;
    }
    .switch{
      display:inline-flex; align-items:center; gap:10px;
      padding:8px 10px;
      border-radius:14px;
      border:1px solid #223145;
      background: rgba(9,14,21,.35);
      color:var(--muted);
      font-size:12px;
      user-select:none;
    }
    .switch input{width:16px;height:16px}
    .notice{
      border:1px dashed rgba(255,204,102,.55);
      border-radius:18px;
      padding:12px 14px;
      background: rgba(255,204,102,.08);
      color:var(--text);
      font-size:12.5px;
      line-height:1.45;
    }
    .notice strong{color:#ffe3a8}
    .smallmono{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo">M</div>
        <div>
          <h1>Magnus Finance — WebApp <span class="sub">ALELU Консалтинг • Прототип для презентации</span></h1>
        </div>
      </div>
      <div class="meta">
        <div class="pill" title="Состояние авторизации">
          <span class="dot" id="authDot"></span>
          <span id="authText">Доступ подтверждён</span>
        </div>
        <button class="btn" id="btnAbout">ТЗ / Сценарии</button>
        <button class="btn primary" id="btnExport">Экспорт JSON</button>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="income">💸 Доходы</div>
      <div class="tab" data-tab="expense">🧾 Расходы</div>
      <div class="tab" data-tab="analytics">📊 Аналитика</div>
      <div class="tab" data-tab="users">👥 Пользователи</div>
      <div class="tab" data-tab="sheet">🧩 Таблица</div>
    </div>

    <!-- CONTENT -->
    <div id="content"></div>

    <div class="footer">
      <div class="badge">UI-прототип • Без backend</div>
      <div class="smallmono">Совет: откройте файл в браузере, затем покажите клиенту «как будет выглядеть WebApp в Telegram».</div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h3 id="modalTitle">Заголовок</h3>
      <p id="modalBody">Текст</p>
      <div class="actions">
        <button class="btn" id="modalClose">Закрыть</button>
      </div>
      <div class="hint" id="modalHint"></div>
    </div>
  </div>

<script>
  // -------------------------------
  // Demo Data (моки под ваше ТЗ)
  // -------------------------------
  const state = {
    role: "EMPLOYEE", // OWNER / EMPLOYEE
    currency: "USD",
    // Справочник приёмок и гео (динамический)
    intakeCatalog: [
      { id:"coinlink", name:"CoinLink", geos:["Коста-Рика"] },
      { id:"latampay", name:"LatamPayments", geos:["Гватемала","Эквадор"] },
      { id:"kiper", name:"Kiper", geos:["Мексика","Аргентина","Перу","Эквадор","Чили","Колумбия"] },
    ],
    // Категории расходов (динамический)
    expenseCategories: ["ФОТ", "Инфраструктура", "Маркетинг", "Сервисы", "Прочее"],
    // Журналы операций
    incomeEntries: [
      // запись: дата, приёмка, гео, сумма, received(bool), by(intake|geo)
      { date:"2025-12-22", intake:"Kiper", geo:"Эквадор", amount: 420, received:true,  level:"geo", changedBy:"@alex", changedAt:"2025-12-22 14:10" },
      { date:"2025-12-22", intake:"Kiper", geo:"Перу",    amount: 310, received:false, level:"geo", changedBy:"@alex", changedAt:"2025-12-22 14:10" },
      { date:"2025-12-24", intake:"LatamPayments", geo:"Эквадор", amount: 180, received:true, level:"geo", changedBy:"@mike", changedAt:"2025-12-24 09:05" },
    ],
    expenseEntries: [
      // запись: дата, категория, сумма, комментарий, editedBy, editedAt
      { date:"2025-12-23", category:"Сервисы", amount: 49, note:"VPN/Proxy", editedBy:"@alex", editedAt:"2025-12-23 11:20" },
      { date:"2025-12-25", category:"Маркетинг", amount: 120, note:"Тест кампании", editedBy:"@mike", editedAt:"2025-12-25 16:44" },
    ],
    users: [
      { tg:"@owner", role:"OWNER", status:"ACTIVE" },
      { tg:"@alex",  role:"EMPLOYEE", status:"ACTIVE" },
      { tg:"@mike",  role:"EMPLOYEE", status:"ACTIVE" },
    ],
    logs: [
      { at:"2025-12-24 09:05", who:"@mike", action:"Отметил выплату: LatamPayments / Эквадор (USD 180)" },
      { at:"2025-12-23 11:20", who:"@alex", action:"Добавил расход: Сервисы (USD 49)" },
    ]
  };

  // -------------------------------
  // Telegram init (safe in browser)
  // -------------------------------
  const tg = window.Telegram?.WebApp;
  function initTelegram(){
    try{
      if(tg){
        tg.ready();
        // В реальном приложении здесь: tg.initData, tg.initDataUnsafe.user, проверка подписи на backend.
      }
    }catch(e){}
  }
  initTelegram();

  // -------------------------------
  // Helpers
  // -------------------------------
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));
  const fmtMoney = (n) => `${Number(n||0).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2})} ${state.currency}`;

  function openModal(title, body, hint=""){
    $("#modalTitle").textContent = title;
    $("#modalBody").innerHTML = body;
    $("#modalHint").textContent = hint;
    $("#modal").style.display = "flex";
  }
  $("#modalClose").addEventListener("click", ()=> $("#modal").style.display="none");
  $("#modal").addEventListener("click", (e)=> { if(e.target.id==="modal") $("#modal").style.display="none"; });

  // Buttons
  $("#btnAbout").addEventListener("click", ()=>{
    const body = `
      <div class="notice">
        <strong>Прототип WebApp</strong> (UI-only). Он показывает клиенту:
        <ul>
          <li>Вкладки: Доходы / Расходы / Аналитика / Пользователи / Таблица</li>
          <li>Логику приёмок и гео с галочками «выплата получена»</li>
          <li>Учет расходов с категориями (все расходы считаются оплаченными)</li>
          <li>Неделя Пн–Вс, показатели: Доход / Расход / Чистый результат</li>
          <li>Роли: Владелец управляет доступами (в реале — через Backend/YDB)</li>
        </ul>
      </div>
    `;
    openModal("ТЗ — отражено в прототипе", body, "В реальной версии данные сохраняются в Google Sheets + логи отправляются в отдельный Telegram-канал.");
  });

  $("#btnExport").addEventListener("click", ()=>{
    const data = JSON.stringify(state, null, 2);
    openModal("Экспорт данных", `<pre style="white-space:pre-wrap; font-family:var(--mono); font-size:11.5px; color:var(--muted); margin:0;">${escapeHtml(data)}</pre>`,
      "В реальной версии вместо JSON будет запись в Google Sheets через backend.");
  });

  function escapeHtml(str){
    return str.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
  }

  // -------------------------------
  // Rendering
  // -------------------------------
  function render(){
    const active = $(".tab.active").dataset.tab;
    if(active==="income") return renderIncome();
    if(active==="expense") return renderExpense();
    if(active==="analytics") return renderAnalytics();
    if(active==="users") return renderUsers();
    if(active==="sheet") return renderSheet();
  }

  function renderIncome(){
    const optionsIntake = state.intakeCatalog.map(i=>`<option value="${i.name}">${i.name}</option>`).join("");
    const allGeos = (intakeName) => state.intakeCatalog.find(x=>x.name===intakeName)?.geos || [];
    const initialIntake = state.intakeCatalog[0]?.name || "";
    const geoOptions = allGeos(initialIntake).map(g=>`<option value="${g}">${g}</option>`).join("");

    $("#content").innerHTML = `
      <div class="grid">
        <div class="card">
            <h2>Добавить доход <span class="small">Выплата от приёмки по гео • ${state.currency}</span></h2>
          <div class="row">
            <div class="field">
              <div class="label">Дата выплаты</div>
              <input id="incDate" type="date" value="${todayISO()}"/>
            </div>
            <div class="field">
              <div class="label">Приёмка</div>
              <select id="incIntake">${optionsIntake}</select>
            </div>
            <div class="field">
              <div class="label">Гео</div>
              <select id="incGeo">${geoOptions}</select>
            </div>
            <div class="field">
              <div class="label">Сумма (${state.currency})</div>
              <input id="incAmount" type="number" min="0" step="0.01" placeholder="Напр. 250"/>
            </div>
          </div>
          <div class="toggle">
            <label class="switch"><input id="incReceived" type="checkbox"/> Отметить «получено» сразу</label>
            <label class="switch"><input id="incAllGeos" type="checkbox"/> Галочка на приёмке (получено по всем гео)</label>
          </div>
          <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn green" id="btnAddIncome">Сохранить доход</button>
            <button class="btn" id="btnAddGeo">Добавить новое гео (демо)</button>
            <button class="btn" id="btnAddIntake">Добавить приёмку (демо)</button>
          </div>

          <div class="help">
            Логика галочек:
            <ul>
              <li>Галочка на <b>гео</b> означает: выплата получена по конкретному гео.</li>
              <li>Галочка на <b>приёмке</b> означает: выплата получена по всем гео данной приёмки.</li>
              <li>Суммы вводятся вручную, валюта фиксирована: <b>USD</b>.</li>
            </ul>
          </div>
        </div>

        <div class="card">
          <h2>Справочник приёмок <span class="small">динамический</span></h2>
          ${renderCatalogMini()}
          <div class="sep"></div>
          <div class="notice">
            <strong>Важно:</strong> в реальной версии изменения справочников доступны только Владельцу и логируются.
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:14px;">
        <h2>Журнал доходов <span class="small">пример данных</span></h2>
        ${renderIncomeTable()}
      </div>
    `;

    // Bind intake->geo
    $("#incIntake").addEventListener("change", (e)=>{
      const geos = allGeos(e.target.value);
      $("#incGeo").innerHTML = geos.map(g=>`<option value="${g}">${g}</option>`).join("");
    });

    // Add income
    $("#btnAddIncome").addEventListener("click", ()=>{
      const date = $("#incDate").value;
      const intake = $("#incIntake").value;
      const geo = $("#incGeo").value;
      const amount = parseFloat($("#incAmount").value || "0");
      const received = $("#incReceived").checked;
      const allGeosFlag = $("#incAllGeos").checked;

      if(!date || !intake || (!geo && !allGeosFlag) || !amount){
        openModal("Проверьте поля", "Дата, приёмка и сумма обязательны. Гео обязательно, если не выбрана опция «по всем гео».");
        return;
      }

      if(allGeosFlag){
        const geos = allGeos(intake);
        geos.forEach(g=>{
          state.incomeEntries.push({
            date, intake, geo:g, amount:0, received:true, level:"intake",
            changedBy:"@demo", changedAt:new Date().toISOString().slice(0,19).replace("T"," ")
          });
        });
        state.logs.unshift({at: nowText(), who:"@demo", action:`Отметил выплату по приёмке: ${intake} (по всем гео)`});
        openModal("Готово", `Отметили выплату <b>${intake}</b> по всем гео. В реале — суммы по гео можно вводить отдельно.`);
      }else{
        state.incomeEntries.push({
          date, intake, geo, amount, received, level:"geo",
          changedBy:"@demo", changedAt: nowText()
        });

  document.addEventListener("click", (e)=>{
    const btn = e.target.closest("button[data-action]");
    if(!btn) return;
    const action = btn.dataset.action;
    const idx = parseInt(btn.dataset.idx,10);

    if(action==="toggleIncome"){
      const rows = state.incomeEntries.slice().sort((a,b)=> (a.date < b.date ? 1 : -1)).slice(0,14);
      const r = rows[idx];
      if(!r) return;
      const entry = state.incomeEntries.find(x=>x===r);
      if(entry){
        entry.received = !entry.received;
        entry.changedBy = "@demo";
        entry.changedAt = nowText();
        state.logs.unshift({at: nowText(), who:"@demo", action:`${entry.received?"Отметил":"Снял отметку"} выплаты: ${entry.intake} / ${entry.geo || "—"}`});
        render();
      }
    }

    if(action==="editExpense"){
      const rows = state.expenseEntries.slice().sort((a,b)=> (a.date < b.date ? 1 : -1)).slice(0,14);
      const r = rows[idx];
      if(!r) return;
      openModal("Редактирование расхода (демо)",
        `<div class="row">
           <div class="field"><div class="label">Дата</div><input id="mEDate" type="date" value="${r.date}"/></div>
           <div class="field"><div class="label">Категория</div>
             <select id="mECat">${state.expenseCategories.map(c=>`<option ${c===r.category?"selected":""} value="${c}">${c}</option>`).join("")}</select>
           </div>
           <div class="field"><div class="label">Сумма</div><input id="mEAmt" type="number" step="0.01" value="${r.amount}"/></div>
         </div>
         <div class="field" style="min-width:100%"><div class="label">Комментарий</div><textarea id="mENote">${r.note||""}</textarea></div>
         <button class="btn green" id="mESave">Сохранить</button>`,
        "По ТЗ редактирование доступно всегда."
      );
      setTimeout(()=>{
        $("#mESave")?.addEventListener("click", ()=>{
          r.date = $("#mEDate").value;
          r.category = $("#mECat").value;
          r.amount = parseFloat($("#mEAmt").value||"0");
          r.note = ($("#mENote").value||"").trim();
          r.editedBy = "@demo";
          r.editedAt = nowText();
          state.logs.unshift({at: nowText(), who:"@demo", action:`Отредактировал расход: ${r.category} (${fmtMoney(r.amount)})`});
          $("#modal").style.display="none";
          render();
        });
      },0);
    }

    if(action==="delExpense"){
      const rows = state.expenseEntries.slice().sort((a,b)=> (a.date < b.date ? 1 : -1)).slice(0,14);
      const r = rows[idx];
      if(!r) return;
      openModal("Удалить расход?", `Удалить запись: <b>${r.category}</b> на сумму <b>${fmtMoney(r.amount)}</b>?<br><br>
        <span class="muted">По ТЗ удаление доступно всегда.</span>`,
        ""
      );
      $("#modalClose").textContent = "Отмена";
      const actions = document.createElement("button");
      actions.className = "btn primary";
      actions.textContent = "Удалить";
      actions.onclick = ()=>{
        const i = state.expenseEntries.indexOf(r);
        if(i>=0) state.expenseEntries.splice(i,1);
        state.logs.unshift({at: nowText(), who:"@demo", action:`Удалил расход: ${r.category} (${fmtMoney(r.amount)})`});
        $("#modal").style.display="none";
        $("#modalClose").textContent = "Закрыть";
        render();
      };
      document.querySelector(".modal .actions").prepend(actions);
      const origClose = $("#modalClose").onclick;
      $("#modalClose").onclick = ()=>{
        actions.remove();
        $("#modalClose").textContent = "Закрыть";
        $("#modal").style.display="none";
        $("#modalClose").onclick = null;
      };
    }

    if(action==="toggleUser" || action==="delUser"){
      openModal("Действия с пользователями (демо)",
        "В демо изменения пользователей не сохраняются. В продакшене: операции по пользователям доступны только Владельцу, хранятся в YDB, подтверждение доступа — обязательное.",
        "Это важно для безопасности: бот закрыт по умолчанию."
      );
    }
  });

  // -------------------------------
  // Tabs
  // -------------------------------
  $$("#tabs .tab").forEach(t=>{
    t.addEventListener("click", ()=>{
      $$("#tabs .tab").forEach(x=>x.classList.remove("active"));
      t.classList.add("active");
      render();
    });
  });

  // -------------------------------
  // Analytics utils
  // -------------------------------
  function weekRange(d){
    const date = new Date(d);
    const day = (date.getDay() + 6) % 7;
    const monday = new Date(date);
    monday.setDate(date.getDate() - day);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    return { start: iso(monday), end: iso(sunday) };
  }
  function iso(d){
    const x = new Date(d);
    const y = x.getFullYear();
    const m = String(x.getMonth()+1).padStart(2,"0");
    const dd= String(x.getDate()).padStart(2,"0");
    return `${y}-${m}-${dd}`;
  }
  function todayISO(){ return iso(new Date()); }
  function nowText(){
    const d = new Date();
    const pad = (n)=> String(n).padStart(2,"0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function inRange(dateStr, start, end){
    return dateStr >= start && dateStr <= end;
  }
  function sumIncome(start, end){
    return state.incomeEntries
      .filter(x=>inRange(x.date, start, end))
      .reduce((s,x)=> s + Number(x.amount||0), 0);
  }
  function sumExpense(start, end){
    return state.expenseEntries
      .filter(x=>inRange(x.date, start, end))
      .reduce((s,x)=> s + Number(x.amount||0), 0);
  }
  function breakdownIncomeByIntake(start, end){
    const out = {};
    state.incomeEntries.filter(x=>inRange(x.date, start, end)).forEach(x=>{
      out[x.intake] = (out[x.intake]||0) + Number(x.amount||0);
    });
    return out;
  }
  function breakdownExpenseByCat(start, end){
    const out = {};
    state.expenseEntries.filter(x=>inRange(x.date, start, end)).forEach(x=>{
      out[x.category] = (out[x.category]||0) + Number(x.amount||0);
    });
    return out;
  }

  // initial render
  render();

  // Auth pill (placeholder)
  $("#authDot").style.background = state.role==="OWNER" ? "var(--warn)" : "var(--accent2)";
  $("#authText").textContent = state.role==="OWNER" ? "Владелец (полный доступ)" : "Сотрудник (доступ одобрен)";

</script>
</body>
</html>
